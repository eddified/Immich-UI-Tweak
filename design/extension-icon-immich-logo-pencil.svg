<?xml version="1.0" encoding="utf-8"?>
<!--
  Immich logomark: exact paths copied from immich/design/immich-logo.svg (unchanged).
  Pencil: original overlay for Immich UI Helper extension concept only.
  No background rect — transparent for toolbar / PNG export.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 792" width="1024" height="1024">
  <style type="text/css">
    .st0{fill:#FA2921;}
    .st1{fill:#ED79B5;}
    .st2{fill:#FFB400;}
    .st3{fill:#1E83F7;}
    .st4{fill:#18C249;}
  </style>
  <defs>
    <linearGradient id="pencil-ferrule" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="35%" stop-color="#bfc5ce"/>
      <stop offset="70%" stop-color="#8b939e"/>
      <stop offset="100%" stop-color="#6d7580"/>
    </linearGradient>
    <linearGradient id="pencil-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fceea3"/>
      <stop offset="55%" stop-color="#e8bc2e"/>
      <stop offset="100%" stop-color="#c9a21a"/>
    </linearGradient>
    <linearGradient id="pencil-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d5b5"/>
      <stop offset="100%" stop-color="#c4a574"/>
    </linearGradient>
  </defs>
  <!-- Official Immich flower (no path edits) -->
