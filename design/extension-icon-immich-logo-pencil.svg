  <!-- Overlay: pencil only — larger, reference-style #2 / HB -->
  <g
    id="pencil-overlay"
    transform="translate(396,396) rotate(-35) translate(2,0)"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Scale ~1.3× about pencil centroid (midpoint along shaft ≈ 45,0) -->
