    />
    <path
      d="M -168 -32 L -168 32 L -148 30 L -148 -30 Z"
      fill="#b8935c"
      opacity="0.85"
    />
    <!-- Painted barrel -->
    <path
      d="M -148 -30 L 232 -30 Q 242 -30 242 -20 L 242 20 Q 242 30 232 30 L -148 30 Q -158 30 -158 20 L -158 -20 Q -158 -30 -148 -30 Z"
      fill="url(#pencil-body)"
      stroke="#a88416"
      stroke-width="1.25"
    />
    <!-- Top highlight strip -->
    <path
      d="M -140 -28 L 220 -28 L 210 -12 L -130 -14 Z"
      fill="#fffdf5"
      opacity="0.45"
    />
    <!-- Ferrule + crimp bands -->
    <rect x="242" y="-33" width="88" height="66" rx="3" fill="url(#pencil-ferrule)" stroke="#5c6370" stroke-width="1"/>
    <line x1="252" y1="-33" x2="252" y2="33" stroke="#5c6370" stroke-width="1" opacity="0.5"/>
    <line x1="262" y1="-33" x2="262" y2="33" stroke="#5c6370" stroke-width="1" opacity="0.35"/>
    <line x1="272" y1="-33" x2="272" y2="33" stroke="#5c6370" stroke-width="1" opacity="0.5"/>
    <line x1="282" y1="-33" x2="282" y2="33" stroke="#5c6370" stroke-width="1" opacity="0.35"/>
    <line x1="292" y1="-33" x2="292" y2="33" stroke="#5c6370" stroke-width="1" opacity="0.5"/>
    <line x1="302" y1="-33" x2="302" y2="33" stroke="#5c6370" stroke-width="1" opacity="0.35"/>
    <line x1="312" y1="-33" x2="312" y2="33" stroke="#5c6370" stroke-width="1" opacity="0.5"/>
    <line x1="322" y1="-33" x2="322" y2="33" stroke="#5c6370" stroke-width="1" opacity="0.35"/>
    <!-- Eraser -->
    <path
